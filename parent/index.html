<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#163b65">
<title>Parent School Dashboard</title>
<style>
:root{--card:#fff;--ink:#172033;--muted:#6f7d90;--line:#e9eef4}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#edf4fb 0,#f7f9fc 420px);color:var(--ink)}
.hero{padding:calc(16px + env(safe-area-inset-top)) 20px 17px;background:linear-gradient(135deg,#112f50,#286ca5);color:#fff;border-radius:0 0 24px 24px;box-shadow:0 9px 26px rgba(20,55,90,.15)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.navBtn{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:850}.heroMain{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}.heroCopy{min-width:0}.gpaBadge{flex:0 0 auto;min-width:82px;padding:9px 12px;border:1px solid rgba(255,255,255,.2);border-radius:15px;background:rgba(255,255,255,.11);text-align:center;box-shadow:0 5px 14px rgba(0,0,0,.08)}.gpaLabel{font-size:9px;font-weight:900;letter-spacing:1.2px;opacity:.7}.gpaValue{font-size:24px;line-height:1.05;font-weight:900;margin-top:2px}.kicker{font-size:10.5px;font-weight:800;letter-spacing:1.5px;opacity:.7;margin-top:10px}.hero h1{font-size:30px;line-height:1;margin:5px 0 4px}.dateRow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.date{font-size:15px;opacity:.92}.schoolDayPill{display:none;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:950;letter-spacing:.9px;line-height:1}.updated{font-size:11px;opacity:.7;margin-top:8px}
.wrap{max-width:900px;margin:0 auto;padding:12px 16px calc(44px + env(safe-area-inset-bottom))}.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 8px 30px rgba(25,52,82,.07)}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.head h2{margin:0;font-size:20px}.status{font-size:12px;font-weight:750;color:var(--muted);text-align:right}
.grades{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grade{--theme1:#4e2864;--theme2:#754096;border:1px solid #d8dde5;background:#fff;border-radius:15px;overflow:hidden;min-height:146px;box-shadow:0 2px 3px rgba(20,36,55,.05);position:relative}.grade.changed{box-shadow:0 0 0 2px rgba(255,255,255,.95),0 0 0 4px rgba(27,93,143,.35),0 5px 14px rgba(20,36,55,.10)}.gradeVisual{height:88px;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(145deg,var(--theme1),var(--theme2));overflow:hidden}.gradeVisual::before{content:attr(data-icon);position:absolute;left:13px;bottom:-15px;font-size:74px;line-height:1;opacity:.12;filter:grayscale(1);transform:rotate(-8deg)}.gradeVisual::after{content:"";position:absolute;right:-24px;top:-20px;width:92px;height:92px;border-radius:28px;border:12px solid rgba(255,255,255,.055);transform:rotate(13deg)}.gradeChange{position:absolute;left:9px;top:8px;z-index:4;background:rgba(255,255,255,.94);color:#173b63;border-radius:999px;padding:5px 7px;font-size:9px;font-weight:950;letter-spacing:.7px;box-shadow:0 2px 7px rgba(0,0,0,.12)}.teacherName{position:absolute;left:10px;right:10px;bottom:5px;z-index:4;color:#fff;font-size:9.5px;font-weight:750;letter-spacing:.15px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.28);opacity:.96}.gradeLetter{font-size:49px;line-height:1;font-weight:850;letter-spacing:-2px;z-index:2}.gradePercent{position:absolute;right:10px;top:8px;font-size:16px;font-weight:850;z-index:3}.gradeInfo{min-height:56px;padding:9px 11px 10px;display:flex;align-items:flex-start}.courseLine{width:100%;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.course{font-size:14.5px;font-weight:600;line-height:1.15;color:#161a22;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}.classDayBadge{flex:0 0 auto;border:1px solid #d7e4ef;background:#eef6fc;color:#1c5f91;border-radius:999px;padding:4px 7px;font-size:9px;font-weight:950;letter-spacing:.7px;white-space:nowrap}
.grade.a{--theme1:#5f205f;--theme2:#8e3a8d}.grade.b{--theme1:#0b6f80;--theme2:#169bb0}.grade.c{--theme1:#a45800;--theme2:#d77a12}.grade.low{--theme1:#9d173f;--theme2:#cb2255}.grade.ng{--theme1:#146678;--theme2:#1596aa}.grade.subject-biology{--theme1:#8b1543;--theme2:#bd2356}.grade.subject-anatomy{--theme1:#552269;--theme2:#7e3e96}.grade.subject-english{--theme1:#795e00;--theme2:#a58508}.grade.subject-geometry{--theme1:#076654;--theme2:#0e9476}.grade.subject-digital{--theme1:#9f3706;--theme2:#d2610f}.grade.subject-history{--theme1:#0b667f;--theme2:#0e96b4}.grade.subject-chorus{--theme1:#5c246c;--theme2:#863a98}.grade.subject-study{--theme1:#425d77;--theme2:#647f9b}
.day{font-size:12px;font-weight:900;letter-spacing:1px;color:var(--muted);margin:17px 2px 7px}.day:first-child{margin-top:0}.assignment{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:13px 3px;border-bottom:1px solid var(--line)}.assignment:last-child{border-bottom:0}.time{font-size:13px;font-weight:850;color:#24669d}.assignmentCourse{font-size:11px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:#24669d;margin-bottom:3px}.title{font-size:15px;font-weight:650;line-height:1.35}.activityGroup{margin-top:20px}.activityGroup:first-child{margin-top:0}.activityGroupTitle{font-size:11px;font-weight:950;letter-spacing:1px;text-transform:uppercase;color:#24669d;margin:0 2px 7px}.activityCourseGroup{margin:11px 0 17px}.activityCourseTitle{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 7px;padding:8px 10px;border-left:4px solid #24669d;border-radius:9px;background:#eef5fb;color:#173f66;font-size:12.5px;font-weight:950;letter-spacing:.35px;text-decoration:none}.activityCourseTitle:visited{color:#173f66}.activityCourseTitle.emailReady{cursor:pointer}.activityCourseMain{display:flex;flex-direction:column;min-width:0}.activityCourseName{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.activityTeacher{margin-top:2px;font-size:10px;line-height:1.15;font-weight:750;letter-spacing:0;color:#60778e}.activityEmailHint{font-weight:900;color:#24669d}.activityCourseCount{font-size:10px;color:#60778e;font-weight:850;flex:0 0 auto}.activity{padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff;font-size:14px;line-height:1.4}.activity.alert{border:2px solid #d92d20;background:#fff8f7;box-shadow:0 2px 8px rgba(217,45,32,.08)}.empty{font-size:14px;color:var(--muted);padding:4px 0}.loading{text-align:center;padding:44px 18px;color:var(--muted)}.loading a{color:#24669d;font-weight:800}
@media(max-width:390px){.grade{min-height:140px}.gradeVisual{height:84px}.gradeLetter{font-size:46px}.course{font-size:14px}.gradePercent{font-size:15px}.gradeInfo{min-height:54px;padding:8px 10px 9px}}@media(min-width:700px){.grades{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.gradeVisual{height:102px}.grade{min-height:166px}.gradeLetter{font-size:56px}}
</style>
</head>
<body>
<header class="hero"><div class="topline"><button class="navBtn" id="studentsBtn" type="button">← My students</button><button class="navBtn" id="signOutBtn" type="button">Sign out</button></div><div class="heroMain"><div class="heroCopy"><div class="kicker">PRIVATE SCHOOL DASHBOARD</div><h1 id="studentTitle">🎓 School Dashboard</h1><div class="dateRow"><div class="date" id="schoolDate">Latest school update</div><div class="schoolDayPill" id="schoolDay"></div></div><div class="updated" id="updated">Loading…</div></div><div class="gpaBadge" id="gpaBadge" hidden><div class="gpaLabel">GPA</div><div class="gpaValue" id="gpaValue">—</div></div></div></header>
<main class="wrap" id="main"><div class="card loading">Loading your private dashboard…</div></main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://vihtghmtnnozflnmecis.supabase.co','sb_publishable_ApNLrNRP70DP-xD0evgTJg_a-jj8mPp');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function gradeClass(g){const l=String(g.letter||'').toUpperCase();if(l.startsWith('A'))return'a';if(l.startsWith('B'))return'b';if(l.startsWith('C'))return'c';if(l.startsWith('D')||l.startsWith('F'))return'low';return'ng'}
function subjectTheme(course){const c=String(course||'').toLowerCase();if(c.includes('biology'))return['subject-biology','🧬'];if(c.includes('anatom'))return['subject-anatomy','🫀'];if(c.includes('english'))return['subject-english','📚'];if(c.includes('geometry')||c.includes('math'))return['subject-geometry','📐'];if(c.includes('digital')||c.includes('business'))return['subject-digital','💻'];if(c.includes('history'))return['subject-history','🌎'];if(c.includes('chorus')||c.includes('music'))return['subject-chorus','♫'];if(c.includes('study'))return['subject-study','✎'];return['','🎓']}
function activityCategory(line){const s=String(line||'');if(s.includes('Current grade:'))return'Submissions';if(s.includes(' · Submitted Late — Awaiting Grade · ')||s.endsWith(' · Submitted Late — Awaiting Grade'))return'Submitted — Awaiting Grade';if(s.includes(' · Submitted — Awaiting Grade · ')||s.endsWith(' · Submitted — Awaiting Grade'))return'Submitted — Awaiting Grade';if(s.includes(' · Missing · ')||s.endsWith(' · Missing'))return'Missing';if(s.includes(' · Not Submitted · ')||s.endsWith(' · Not Submitted'))return'Not Submitted';if(s.includes(' · Canvas status:'))return'Needs Review';const types=[['Submission','Submissions'],['Not graded yet','Not Graded Yet'],['Due date activity','Not Graded Yet'],['Grading','Grading'],['Quiz activity','Quiz activity'],['Assignment activity','Assignment activity'],['Discussion','Discussions'],['Message','Messages'],['Announcement','Announcements'],['Canvas activity','Other Canvas activity']];for(const [label,group] of types){if(s.includes(` · ${label} · `)||s.endsWith(` · ${label}`))return group}return'Other activity'}
function activityCourse(line){const s=String(line||'');const i=s.indexOf(' — ');return i>0?s.slice(0,i).trim():'Other'}
function activityDetail(line){const s=String(line||'');const i=s.indexOf(' — ');return i>0?s.slice(i+3).trim():s}
function validTeacherEmail(value){const s=String(value||'').trim();return /^[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}$/i.test(s)?s:''}
function normWords(value){return String(value||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,' ').replace(/\b20\d{2}\b/g,' ').replace(/\s+/g,' ').trim()}
function teacherSurname(value){return normWords(String(value||'').split(',')[0])}
function activityTeacherHint(value){
  const raw=String(value||'').trim();
  const possessive=raw.match(/\b(?:mr|mrs|ms|dr)\.?\s+([A-Za-z][A-Za-z.'’-]*(?:\s+(?:jr\.?|sr\.?|ii|iii|iv))?)['’]s\b/i);
  if(possessive)return normWords(possessive[1]);
  const suffix=raw.match(/[-–—]\s*([A-Za-z][A-Za-z.'’-]*(?:\s+(?:jr\.?|sr\.?|ii|iii|iv))?)\s*$/i);
  return suffix?normWords(suffix[1]):'';
}
function genericCourseKey(value){
  let s=String(value||'');
  s=s.replace(/\b(?:fall|spring)\s+20\d{2}\s*:\s*/ig,'');
  s=s.replace(/^\s*per\.?\s*[\d& ,/-]+\s*/i,'');
  s=s.replace(/[-–—]\s*[A-Za-z][A-Za-z.'’-]*(?:\s+(?:jr\.?|sr\.?|ii|iii|iv))?\s*$/i,'');
  s=s.replace(/\b20\d{2}\s*[-–—/]\s*20\d{2}\b/g,'');
  return normWords(s).replace(/\b(?:m j|hon|as)\b/g,' ').replace(/\s+/g,' ').trim();
}
function teacherContactForCourse(course,grades){
  const all=Array.isArray(grades)?grades:[];
  const hint=activityTeacherHint(course);
  if(hint){
    const byTeacher=all.filter(g=>teacherSurname(g.teacher)===hint);
    const withEmail=byTeacher.filter(g=>validTeacherEmail(g.teacherEmail));
    if(withEmail.length)return withEmail[0];
    if(byTeacher.length)return byTeacher[0];
  }

  const key=genericCourseKey(course);
  if(!key)return null;
  const exact=all.filter(g=>genericCourseKey(g.course)===key);
  if(exact.length===1)return exact[0];
  const exactEmail=exact.find(g=>validTeacherEmail(g.teacherEmail));
  if(exactEmail)return exactEmail;

  const targetTokens=new Set(key.split(' ').filter(x=>x.length>1));
  let best=null,bestScore=0,tied=false;
  for(const g of all){
    const gKey=genericCourseKey(g.course);
    const tokens=new Set(gKey.split(' ').filter(x=>x.length>1));
    if(!tokens.size||!targetTokens.size)continue;
    let overlap=0;
    for(const token of targetTokens)if(tokens.has(token))overlap++;
    const score=overlap/Math.max(targetTokens.size,tokens.size);
    if(score>bestScore){best=g;bestScore=score;tied=false}
    else if(score===bestScore&&score>0)tied=true;
  }
  return bestScore>=0.6&&!tied?best:null;
}
function failingSubmission(line){if(activityCategory(line)!=='Submissions')return false;const grade=String(line).split('Current grade:')[1]||'';const pct=grade.match(/(-?\d+(?:\.\d+)?)%/);if(pct&&Number(pct[1])<70)return true;return/(?:^|[·\s])F[+-]?(?:$|[·\s])/i.test(grade)}
function renderActivity(activity,grades){
  if(!activity.length)return '<div class="empty">Nothing new</div>';
  const order=['Submissions','Missing','Submitted — Awaiting Grade','Not Submitted','Not Graded Yet','Needs Review','Grading','Quiz activity','Assignment activity','Discussions','Messages','Other Canvas activity','Other activity','Announcements'];
  const groups={};
  for(const item of activity){const group=activityCategory(item);(groups[group]??=[]).push(item)}
  return order.filter(group=>groups[group]?.length).map(group=>{
    const classes={};
    for(const item of groups[group]){const course=activityCourse(item);(classes[course]??=[]).push(item)}
    const classHtml=Object.entries(classes).map(([course,items])=>{
      const contact=teacherContactForCourse(course,grades);
      const teacher=String(contact?.teacher||'').trim();
      const email=validTeacherEmail(contact?.teacherEmail);
      const teacherHtml=teacher?'<span class="activityTeacher">'+esc(teacher)+(email?' <span class="activityEmailHint">· tap to email</span>':'')+'</span>':'';
      const titleInner='<span class="activityCourseMain"><span class="activityCourseName">'+esc(course)+'</span>'+teacherHtml+'</span><span class="activityCourseCount">'+items.length+'</span>';
      const header=email?'<a class="activityCourseTitle emailReady" href="mailto:'+esc(email)+'">'+titleInner+'</a>':'<div class="activityCourseTitle">'+titleInner+'</div>';
      const rows=items.map(item=>'<div class="activity '+(failingSubmission(item)?'alert':'')+'">'+esc(activityDetail(item))+'</div>').join('');
      return '<div class="activityCourseGroup">'+header+rows+'</div>';
    }).join('');
    return '<div class="activityGroup"><div class="activityGroupTitle">'+esc(group)+' · '+groups[group].length+'</div>'+classHtml+'</div>';
  }).join('');
}
function render(student,d,updatedAt){document.getElementById('studentTitle').textContent=`🎓 ${String(student||'Student').toUpperCase()}`;document.getElementById('schoolDate').textContent=d.dateLabel||'Latest school update';const schoolDay=document.getElementById('schoolDay');const schoolDayValue=String(d.schoolDay||'').toUpperCase();if(schoolDayValue==='A'||schoolDayValue==='B'){schoolDay.textContent=`${schoolDayValue} DAY`;schoolDay.style.display='inline-flex'}else{schoolDay.style.display='none'}const gpaBadge=document.getElementById('gpaBadge');const gpaValue=document.getElementById('gpaValue');const gpa=String(d.gpa??'').trim();if(gpa){gpaValue.textContent=gpa;gpaBadge.hidden=false}else{gpaBadge.hidden=true}const when=updatedAt?new Date(updatedAt):(d.updatedAt?new Date(d.updatedAt):new Date());document.getElementById('updated').textContent='Updated '+when.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});const grades=(d.grades||[]).map(g=>{const theme=subjectTheme(g.course);const raw=Number(g.percent);const pct=g.percent===null||g.percent===undefined?String(g.display||g.letter||'NG'):(Number.isFinite(raw)?`${raw}%`:String(g.display||g.letter||'NG'));const letter=String(g.letter||'NG').toUpperCase();const changed=String(g.change||'').toUpperCase()==='CHANGED';const marker=changed?'<div class="gradeChange">UPDATED</div>':'';return `<div class="grade ${gradeClass(g)} ${theme[0]} ${changed?'changed':''}"><div class="gradeVisual" data-icon="${esc(theme[1])}">${marker}<div class="gradePercent">${esc(pct)}</div><div class="gradeLetter">${esc(letter)}</div>${g.teacher?`<div class="teacherName">${esc(g.teacher)}</div>`:''}</div><div class="gradeInfo"><div class="courseLine"><div class="course">${esc(g.course)}</div>${g.day?`<div class="classDayBadge">${esc(g.day)} DAY</div>`:''}</div></div></div>`}).join('')||'<div class="empty">No grade data yet.</div>';const assignments=d.assignments||[];let last='';const due=assignments.map(x=>{let h='';if(x.day!==last){last=x.day;h=`<div class="day">${esc(x.day)}</div>`}return h+`<div class="assignment"><div class="time">${esc(x.time)}</div><div><div class="assignmentCourse">${esc(x.course||'Canvas')}</div><div class="title">${esc(x.title)}</div></div></div>`}).join('')||'<div class="empty">No unfinished Canvas work showing right now.</div>';const canvasActivity=Array.isArray(d.canvasActivity)?d.canvasActivity:[];const activity=canvasActivity.length?canvasActivity:(d.activity||[]);const activityStatus=canvasActivity.length?(d.canvasActivityStatus||'Canvas activity'):(d.activityStatus||'Up to date');const activityTitle=canvasActivity.length?'📰 Canvas Activity':'📰 Activity';const act=renderActivity(activity,d.grades||[]);document.getElementById('main').innerHTML=`<section class="card"><div class="head"><h2>Grades</h2><div class="status">${esc(d.gradeStatus||'Current grades')}</div></div><div class="grades">${grades}</div></section><section class="card"><div class="head"><h2>📅 Canvas Due — Next 7 Days</h2><div class="status">${assignments.length?assignments.length+' upcoming':'Nothing due'}</div></div>${due}</section><section class="card"><div class="head"><h2>${activityTitle}</h2><div class="status">${esc(activityStatus)}</div></div>${act}</section>`}
document.getElementById('studentsBtn').onclick=()=>{location.href='../signup/'};document.getElementById('signOutBtn').onclick=async()=>{await supabase.auth.signOut();location.replace('../signup/')};
const studentId=new URLSearchParams(location.search).get('student');const {data:{session}}=await supabase.auth.getSession();if(!session)location.replace('../signup/');else if(!studentId)location.replace('../signup/');else{const {data,error}=await supabase.rpc('get_my_student_dashboard',{p_student_id:studentId});if(error){document.getElementById('main').innerHTML=`<div class="card empty">${esc(error.message)}</div>`}else{const row=Array.isArray(data)?data[0]:data;if(!row)location.replace('../signup/');else if(row.connection_status!=='connected')location.replace('../signup/');else if(!row.dashboard_data||!Object.keys(row.dashboard_data).length){document.getElementById('studentTitle').textContent=`🎓 ${String(row.first_name||'Student').toUpperCase()}`;if(row.worker_status==='error'){document.getElementById('updated').textContent='School sync needs attention';document.getElementById('main').innerHTML='<div class="card loading"><strong>The first school sync did not finish.</strong><br><br>Your student connection is still saved. Return to My Students, choose <strong>Manage school login</strong>, and update or re-save the student’s BCPS login.<br><br><a href="../signup/">← Return to My Students</a></div>'}else{document.getElementById('updated').textContent='Building the first dashboard…';document.getElementById('main').innerHTML='<div class="card loading">The student connection is saved. Focus grades, Canvas work, and recent activity are being collected now.<br><br>This page will refresh automatically.</div>';setTimeout(()=>location.reload(),15000)}}else render(row.first_name,row.dashboard_data,row.dashboard_updated_at)}}
</script>
</body>
</html>
