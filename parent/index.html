<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#163b65">
<title>Parent School Dashboard</title>
<style>
:root{--card:#fff;--ink:#172033;--muted:#6f7d90;--line:#e9eef4}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#edf4fb 0,#f7f9fc 420px);color:var(--ink)}
.hero{padding:calc(16px + env(safe-area-inset-top)) 20px 17px;background:linear-gradient(135deg,#112f50,#286ca5);color:#fff;border-radius:0 0 24px 24px;box-shadow:0 9px 26px rgba(20,55,90,.15)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.navBtn{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:850}.heroMain{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}.heroCopy{min-width:0}.gpaBadge{flex:0 0 auto;min-width:82px;padding:9px 12px;border:1px solid rgba(255,255,255,.2);border-radius:15px;background:rgba(255,255,255,.11);text-align:center;box-shadow:0 5px 14px rgba(0,0,0,.08)}.gpaLabel{font-size:9px;font-weight:900;letter-spacing:1.2px;opacity:.7}.gpaValue{font-size:24px;line-height:1.05;font-weight:900;margin-top:2px}.kicker{font-size:10.5px;font-weight:800;letter-spacing:1.5px;opacity:.7;margin-top:10px}.hero h1{font-size:30px;line-height:1;margin:5px 0 4px}.date{font-size:15px;opacity:.92}.updated{font-size:11px;opacity:.7;margin-top:8px}
.wrap{max-width:900px;margin:0 auto;padding:12px 16px calc(44px + env(safe-area-inset-bottom))}.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 8px 30px rgba(25,52,82,.07)}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.head h2{margin:0;font-size:20px}.status{font-size:12px;font-weight:750;color:var(--muted);text-align:right}
.grades{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grade{--theme1:#4e2864;--theme2:#754096;border:1px solid #d8dde5;background:#fff;border-radius:15px;overflow:hidden;min-height:146px;box-shadow:0 2px 3px rgba(20,36,55,.05);position:relative}.grade.changed{box-shadow:0 0 0 2px rgba(255,255,255,.95),0 0 0 4px rgba(27,93,143,.35),0 5px 14px rgba(20,36,55,.10)}.gradeVisual{height:88px;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(145deg,var(--theme1),var(--theme2));overflow:hidden}.gradeVisual::before{content:attr(data-icon);position:absolute;left:13px;bottom:-15px;font-size:74px;line-height:1;opacity:.12;filter:grayscale(1);transform:rotate(-8deg)}.gradeVisual::after{content:"";position:absolute;right:-24px;top:-20px;width:92px;height:92px;border-radius:28px;border:12px solid rgba(255,255,255,.055);transform:rotate(13deg)}.gradeChange{position:absolute;left:9px;top:8px;z-index:4;background:rgba(255,255,255,.94);color:#173b63;border-radius:999px;padding:5px 7px;font-size:9px;font-weight:950;letter-spacing:.7px;box-shadow:0 2px 7px rgba(0,0,0,.12)}.gradeLetter{font-size:49px;line-height:1;font-weight:850;letter-spacing:-2px;z-index:2}.gradePercent{position:absolute;right:10px;top:8px;font-size:16px;font-weight:850;z-index:3}.gradeInfo{min-height:56px;padding:9px 11px 10px;display:flex;align-items:flex-start}.course{font-size:14.5px;font-weight:600;line-height:1.15;color:#161a22;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grade.a{--theme1:#5f205f;--theme2:#8e3a8d}.grade.b{--theme1:#0b6f80;--theme2:#169bb0}.grade.c{--theme1:#a45800;--theme2:#d77a12}.grade.low{--theme1:#9d173f;--theme2:#cb2255}.grade.ng{--theme1:#146678;--theme2:#1596aa}.grade.subject-biology{--theme1:#8b1543;--theme2:#bd2356}.grade.subject-anatomy{--theme1:#552269;--theme2:#7e3e96}.grade.subject-english{--theme1:#795e00;--theme2:#a58508}.grade.subject-geometry{--theme1:#076654;--theme2:#0e9476}.grade.subject-digital{--theme1:#9f3706;--theme2:#d2610f}.grade.subject-history{--theme1:#0b667f;--theme2:#0e96b4}.grade.subject-chorus{--theme1:#5c246c;--theme2:#863a98}.grade.subject-study{--theme1:#425d77;--theme2:#647f9b}
.day{font-size:12px;font-weight:900;letter-spacing:1px;color:var(--muted);margin:17px 2px 7px}.day:first-child{margin-top:0}.assignment{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:13px 3px;border-bottom:1px solid var(--line)}.assignment:last-child{border-bottom:0}.time{font-size:13px;font-weight:850;color:#24669d}.assignmentCourse{font-size:11px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:#24669d;margin-bottom:3px}.title{font-size:15px;font-weight:650;line-height:1.35}.activity{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.4}.activity:last-child{border-bottom:0}.empty{font-size:14px;color:var(--muted);padding:4px 0}.loading{text-align:center;padding:44px 18px;color:var(--muted)}.loading a{color:#24669d;font-weight:800}
@media(max-width:390px){.grade{min-height:140px}.gradeVisual{height:84px}.gradeLetter{font-size:46px}.course{font-size:14px}.gradePercent{font-size:15px}.gradeInfo{min-height:54px;padding:8px 10px 9px}}@media(min-width:700px){.grades{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.gradeVisual{height:102px}.grade{min-height:166px}.gradeLetter{font-size:56px}}
</style>
</head>
<body>
<header class="hero"><div class="topline"><button class="navBtn" id="studentsBtn" type="button">← My students</button><button class="navBtn" id="signOutBtn" type="button">Sign out</button></div><div class="heroMain"><div class="heroCopy"><div class="kicker">PRIVATE SCHOOL DASHBOARD</div><h1 id="studentTitle">🎓 School Dashboard</h1><div class="date" id="schoolDate">Latest school update</div><div class="updated" id="updated">Loading…</div></div><div class="gpaBadge" id="gpaBadge" hidden><div class="gpaLabel">GPA</div><div class="gpaValue" id="gpaValue">—</div></div></div></header>
<main class="wrap" id="main"><div class="card loading">Loading your private dashboard…</div></main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://vihtghmtnnozflnmecis.supabase.co','sb_publishable_ApNLrNRP70DP-xD0evgTJg_a-jj8mPp');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function gradeClass(g){const l=String(g.letter||'').toUpperCase();if(l.startsWith('A'))return'a';if(l.startsWith('B'))return'b';if(l.startsWith('C'))return'c';if(l.startsWith('D')||l.startsWith('F'))return'low';return'ng'}
function subjectTheme(course){const c=String(course||'').toLowerCase();if(c.includes('biology'))return['subject-biology','🧬'];if(c.includes('anatom'))return['subject-anatomy','🫀'];if(c.includes('english'))return['subject-english','📚'];if(c.includes('geometry')||c.includes('math'))return['subject-geometry','📐'];if(c.includes('digital')||c.includes('business'))return['subject-digital','💻'];if(c.includes('history'))return['subject-history','🌎'];if(c.includes('chorus')||c.includes('music'))return['subject-chorus','♫'];if(c.includes('study'))return['subject-study','✎'];return['','🎓']}
function render(student,d,updatedAt){document.getElementById('studentTitle').textContent=`🎓 ${String(student||'Student').toUpperCase()}`;document.getElementById('schoolDate').textContent=d.dateLabel||'Latest school update';const gpaBadge=document.getElementById('gpaBadge');const gpaValue=document.getElementById('gpaValue');const gpa=String(d.gpa??'').trim();if(gpa){gpaValue.textContent=gpa;gpaBadge.hidden=false}else{gpaBadge.hidden=true}const when=updatedAt?new Date(updatedAt):(d.updatedAt?new Date(d.updatedAt):new Date());document.getElementById('updated').textContent='Updated '+when.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});const grades=(d.grades||[]).map(g=>{const theme=subjectTheme(g.course);const raw=Number(g.percent);const pct=g.percent===null||g.percent===undefined?String(g.display||g.letter||'NG'):(Number.isFinite(raw)?`${raw}%`:String(g.display||g.letter||'NG'));const letter=String(g.letter||'NG').toUpperCase();const changed=String(g.change||'').toUpperCase()==='CHANGED';const marker=changed?'<div class="gradeChange">UPDATED</div>':'';return `<div class="grade ${gradeClass(g)} ${theme[0]} ${changed?'changed':''}"><div class="gradeVisual" data-icon="${esc(theme[1])}">${marker}<div class="gradePercent">${esc(pct)}</div><div class="gradeLetter">${esc(letter)}</div></div><div class="gradeInfo"><div class="course">${esc(g.course)}</div></div></div>`}).join('')||'<div class="empty">No grade data yet.</div>';const assignments=d.assignments||[];let last='';const due=assignments.map(x=>{let h='';if(x.day!==last){last=x.day;h=`<div class="day">${esc(x.day)}</div>`}return h+`<div class="assignment"><div class="time">${esc(x.time)}</div><div><div class="assignmentCourse">${esc(x.course||'Canvas')}</div><div class="title">${esc(x.title)}</div></div></div>`}).join('')||'<div class="empty">No unfinished Canvas work showing right now.</div>';const activity=d.activity||[];const act=activity.length?activity.map(x=>`<div class="activity">${esc(x)}</div>`).join(''):'<div class="empty">Nothing new</div>';document.getElementById('main').innerHTML=`<section class="card"><div class="head"><h2>Grades</h2><div class="status">${esc(d.gradeStatus||'Current grades')}</div></div><div class="grades">${grades}</div></section><section class="card"><div class="head"><h2>📅 Canvas Due</h2><div class="status">${assignments.length?assignments.length+' upcoming':'Nothing due'}</div></div>${due}</section><section class="card"><div class="head"><h2>📰 Activity</h2><div class="status">${esc(d.activityStatus||'Up to date')}</div></div>${act}</section>`}
document.getElementById('studentsBtn').onclick=()=>{location.href='../signup/'};document.getElementById('signOutBtn').onclick=async()=>{await supabase.auth.signOut();location.replace('../signup/')};
const studentId=new URLSearchParams(location.search).get('student');const {data:{session}}=await supabase.auth.getSession();if(!session)location.replace('../signup/');else if(!studentId)location.replace('../signup/');else{const {data,error}=await supabase.rpc('get_my_student_dashboard',{p_student_id:studentId});if(error){document.getElementById('main').innerHTML=`<div class="card empty">${esc(error.message)}</div>`}else{const row=Array.isArray(data)?data[0]:data;if(!row)location.replace('../signup/');else if(row.connection_status!=='connected')location.replace('../signup/');else if(!row.dashboard_data||!Object.keys(row.dashboard_data).length){document.getElementById('studentTitle').textContent=`🎓 ${String(row.first_name||'Student').toUpperCase()}`;if(row.worker_status==='error'){document.getElementById('updated').textContent='School sync needs attention';document.getElementById('main').innerHTML='<div class="card loading"><strong>The first school sync did not finish.</strong><br><br>Your student connection is still saved. Return to My Students, choose <strong>Manage school login</strong>, and update or re-save the student’s BCPS login.<br><br><a href="../signup/">← Return to My Students</a></div>'}else{document.getElementById('updated').textContent='Building the first dashboard…';document.getElementById('main').innerHTML='<div class="card loading">The student connection is saved. Focus grades, Canvas work, and recent activity are being collected now.<br><br>This page will refresh automatically.</div>';setTimeout(()=>location.reload(),15000)}}else render(row.first_name,row.dashboard_data,row.dashboard_updated_at)}}
</script>
</body>
</html>
