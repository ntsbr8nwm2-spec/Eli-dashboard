name: Restore pilot school login

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-pilot.yml'

permissions:
  contents: read
  id-token: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore pilot credentials securely
        env:
          PILOT_BCPS_USERNAME: ${{ secrets.BCPS_USERNAME }}
          PILOT_BCPS_PASSWORD: ${{ secrets.BCPS_PASSWORD }}
        run: node parent-worker-client.mjs seed-pilot
