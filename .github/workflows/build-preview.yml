name: Build dashboard preview

on:
  workflow_dispatch:
  push:
    paths:
      - 'preview.b64.txt'
      - '.github/workflows/build-preview.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode preview image
        run: base64 -d preview.b64.txt > preview.png
      - name: Commit preview image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview.png
          if git diff --cached --quiet; then
            echo "No preview changes"
          else
            git commit -m "Build dashboard preview image"
            git push
          fi
