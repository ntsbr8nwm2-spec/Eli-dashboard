name: Pilot student monitor

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pilot-student-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Check out dashboard repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Focus grade monitor
        id: monitor
        continue-on-error: true
        working-directory: students/pilot
        env:
          BCPS_USERNAME: ${{ secrets.PILOT_BCPS_USERNAME }}
          BCPS_PASSWORD: ${{ secrets.PILOT_BCPS_PASSWORD }}
        run: node ../../school-monitor.mjs

      - name: Save previous Canvas assignments
        if: steps.monitor.outcome == 'success'
        working-directory: students/pilot
        run: node ../../canvas-guard.mjs before

      - name: Run Canvas collector
        id: canvas
        if: steps.monitor.outcome == 'success'
        continue-on-error: true
        working-directory: students/pilot
        env:
          BCPS_USERNAME: ${{ secrets.PILOT_BCPS_USERNAME }}
          BCPS_PASSWORD: ${{ secrets.PILOT_BCPS_PASSWORD }}
        run: node ../../canvas-only.mjs

      - name: Confirm empty Canvas result
        if: steps.canvas.outcome == 'success'
        working-directory: students/pilot
        run: node ../../canvas-guard.mjs after

      - name: Run Focus activity collector
        id: news
        if: steps.monitor.outcome == 'success'
        continue-on-error: true
        working-directory: students/pilot
        env:
          BCPS_USERNAME: ${{ secrets.PILOT_BCPS_USERNAME }}
          BCPS_PASSWORD: ${{ secrets.PILOT_BCPS_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            echo "Focus News attempt $attempt"
            if node ../../focus-news-v2.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 4
            fi
          done
          exit 1

      - name: Sanitize Canvas dashboard output
        if: steps.monitor.outcome == 'success'
        working-directory: students/pilot
        run: node ../../sanitize-dashboard.mjs

      - name: Commit pilot dashboard result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- students/pilot/data.json
          for file in news-state.json canvas-state.json auth-debug.json canvas-debug.json news-debug.json; do
            path="students/pilot/$file"
            if [ -e "$path" ] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git add -A -- "$path"
            fi
          done

          if git diff --cached --quiet; then
            echo "No pilot dashboard changes to commit"
          else
            git commit -m "Update pilot student dashboard"
            git pull --rebase origin main
            git push
          fi

      - name: Upload pilot diagnostics
        if: steps.monitor.outcome == 'failure' || steps.canvas.outcome == 'failure' || steps.news.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pilot-student-debug
          path: |
            students/pilot/auth-debug.json
            students/pilot/canvas-debug.json
            students/pilot/news-debug.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Mark pilot failure
        if: steps.monitor.outcome == 'failure' || steps.canvas.outcome == 'failure' || steps.news.outcome == 'failure'
        run: exit 1
