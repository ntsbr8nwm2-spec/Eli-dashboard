name: Unattended school monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12,17,21 * * *'
  push:
    paths:
      - 'school-monitor.mjs'
      - '.github/workflows/school-monitor.yml'

permissions:
  contents: write

concurrency:
  group: unattended-school-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out dashboard repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run unattended Focus monitor
        id: monitor
        continue-on-error: true
        env:
          BCPS_USERNAME: ${{ secrets.BCPS_USERNAME }}
          BCPS_PASSWORD: ${{ secrets.BCPS_PASSWORD }}
        run: node school-monitor.mjs

      - name: Commit dashboard or safe diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- data.json

          if [ -e auth-debug.json ] || git ls-files --error-unmatch auth-debug.json >/dev/null 2>&1; then
            git add -A -- auth-debug.json
          fi

          if git diff --cached --quiet; then
            echo "No dashboard or diagnostic changes to commit"
          else
            git commit -m "Update unattended school monitor result"
            git pull --rebase origin main
            git push
          fi

      - name: Upload safe auth diagnostics on failure
        if: steps.monitor.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: school-monitor-auth-debug
          path: auth-debug.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Mark monitor failure
        if: steps.monitor.outcome == 'failure'
        run: exit 1
