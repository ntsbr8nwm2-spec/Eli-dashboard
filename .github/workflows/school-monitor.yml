name: Unattended school monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '18 23 23 8 *'
  push:
    paths:
      - 'school-monitor.mjs'
      - '.github/workflows/school-monitor.yml'

permissions:
  contents: write

concurrency:
  group: unattended-school-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out dashboard repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run unattended Focus monitor
        env:
          BCPS_USERNAME: ${{ secrets.BCPS_USERNAME }}
          BCPS_PASSWORD: ${{ secrets.BCPS_PASSWORD }}
        run: node school-monitor.mjs

      - name: Commit dashboard update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit"
          else
            git commit -m "Update dashboard from unattended Focus monitor"
            git push
          fi

      - name: Upload safe auth diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: school-monitor-auth-debug
          path: auth-debug.json
          if-no-files-found: ignore
          retention-days: 3
