name: Unattended school monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12,17,21 * * *'
  push:
    paths:
      - 'school-monitor.mjs'
      - 'school-extras.mjs'
      - 'sanitize-dashboard.mjs'
      - '.github/workflows/school-monitor.yml'

permissions:
  contents: write

concurrency:
  group: unattended-school-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out dashboard repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run unattended Focus grade monitor
        id: monitor
        continue-on-error: true
        env:
          BCPS_USERNAME: ${{ secrets.BCPS_USERNAME }}
          BCPS_PASSWORD: ${{ secrets.BCPS_PASSWORD }}
        run: node school-monitor.mjs

      - name: Run Focus activity and Canvas collectors
        id: extras
        if: steps.monitor.outcome == 'success'
        continue-on-error: true
        env:
          BCPS_USERNAME: ${{ secrets.BCPS_USERNAME }}
          BCPS_PASSWORD: ${{ secrets.BCPS_PASSWORD }}
        run: node school-extras.mjs

      - name: Sanitize Canvas dashboard output
        if: steps.monitor.outcome == 'success'
        run: node sanitize-dashboard.mjs

      - name: Commit dashboard, state, or safe diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- data.json

          for file in school-state.json auth-debug.json extras-debug.json; do
            if [ -e "$file" ] || git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
              git add -A -- "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "No dashboard, state, or diagnostic changes to commit"
          else
            git commit -m "Update unattended school monitor result"
            git pull --rebase origin main
            git push
          fi

      - name: Upload Focus auth diagnostics on failure
        if: steps.monitor.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: school-monitor-auth-debug
          path: auth-debug.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload extras diagnostics on failure
        if: steps.extras.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: school-extras-debug
          path: extras-debug.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Mark Focus grade failure
        if: steps.monitor.outcome == 'failure'
        run: exit 1

      - name: Mark extras failure
        if: steps.extras.outcome == 'failure'
        run: exit 1
