name: Unattended school monitor

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unattended-school-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Check out dashboard repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run unattended Focus grade monitor
        id: monitor
        continue-on-error: true
        env:
          BCPS_USERNAME: ${{ secrets.BCPS_USERNAME }}
          BCPS_PASSWORD: ${{ secrets.BCPS_PASSWORD }}
        run: node school-monitor.mjs

      - name: Save previous Canvas assignments
        if: steps.monitor.outcome == 'success'
        run: node canvas-guard.mjs before

      - name: Run Canvas collector
        id: canvas
        if: steps.monitor.outcome == 'success'
        continue-on-error: true
        env:
          BCPS_USERNAME: ${{ secrets.BCPS_USERNAME }}
          BCPS_PASSWORD: ${{ secrets.BCPS_PASSWORD }}
        run: node canvas-only.mjs

      - name: Confirm empty Canvas result
        if: steps.canvas.outcome == 'success'
        run: node canvas-guard.mjs after

      - name: Run robust Focus News collector
        id: news
        if: steps.monitor.outcome == 'success'
        continue-on-error: true
        env:
          BCPS_USERNAME: ${{ secrets.BCPS_USERNAME }}
          BCPS_PASSWORD: ${{ secrets.BCPS_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            echo "Focus News attempt $attempt"
            if node focus-news-v2.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Focus News retrying after 4 seconds"
              sleep 4
            fi
          done
          exit 1

      - name: Sanitize Canvas dashboard output
        if: steps.monitor.outcome == 'success'
        run: node sanitize-dashboard.mjs

      - name: Commit dashboard, state, or safe diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- data.json

          for file in news-state.json canvas-state.json auth-debug.json canvas-debug.json news-debug.json; do
            if [ -e "$file" ] || git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
              git add -A -- "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "No dashboard, state, or diagnostic changes to commit"
          else
            git commit -m "Update unattended school monitor result"
            git pull --rebase origin main
            git push
          fi

      - name: Upload Focus auth diagnostics on failure
        if: steps.monitor.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: school-monitor-auth-debug
          path: auth-debug.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload Canvas diagnostics on failure
        if: steps.canvas.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: canvas-debug
          path: canvas-debug.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload News diagnostics on failure
        if: steps.news.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: focus-news-debug
          path: news-debug.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Mark Focus grade failure
        if: steps.monitor.outcome == 'failure'
        run: exit 1

      - name: Mark Canvas failure
        if: steps.canvas.outcome == 'failure'
        run: exit 1

      - name: Mark News failure
        if: steps.news.outcome == 'failure'
        run: exit 1
