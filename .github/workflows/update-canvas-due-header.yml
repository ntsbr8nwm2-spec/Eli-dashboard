name: Update Canvas Due header

on:
  push:
    paths:
      - 'update-canvas-due-header.mjs'
      - '.github/workflows/update-canvas-due-header.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update header
        run: node update-canvas-due-header.mjs
      - name: Commit header change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parent/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Label Canvas Due as next 7 days"
          git push
