name: One-time GPA navigation fix

on:
  push:
    paths:
      - '.github/workflows/one-time-gpa-navigation-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch GPA navigation
        run: |
          echo '' | base64 -d > /tmp/patch_gpa.py
          python /tmp/patch_gpa.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add school-monitor.mjs
          git commit -m "Read GPA from Focus grade summary views"
          git push
