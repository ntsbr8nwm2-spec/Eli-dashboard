name: Apply unlimited Canvas groups

on:
  push:
    paths:
      - 'apply-unlimited-canvas-groups.mjs'
      - '.github/workflows/apply-unlimited-canvas-groups.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply unlimited Canvas upgrade
        run: node apply-unlimited-canvas-groups.mjs
      - name: Syntax check collector
        run: node --check canvas-only.mjs
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canvas-only.mjs parent/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove Canvas caps and group activity by class"
          git push
