name: Apply Canvas inventory upgrade

on:
  push:
    paths:
      - 'apply-canvas-inventory-upgrade.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply upgrade
        run: node apply-canvas-inventory-upgrade.mjs
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canvas-only.mjs parent/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use Canvas inventory for not graded items and sort newest first"
          git push
