name: One-time Focus GPA sweep

on:
  push:
    paths:
      - '.github/workflows/one-time-focus-gpa-sweep.yml'

permissions:
  contents: read
  id-token: write

jobs:
  focus-sweep:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        slot: [1, 2]
    env:
      PARENT_WORKDIR: /tmp/parent-school-run
    steps:
      - name: Check out monitor engine
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lease next private parent dashboard
        run: node parent-worker-client.mjs lease

      - name: Prepare isolated student workspace
        if: env.NO_PARENT_JOB != 'true'
        run: |
          cp school-monitor.mjs "$PARENT_WORKDIR"/
          chmod 700 "$PARENT_WORKDIR"
          chmod 600 "$PARENT_WORKDIR"/*.json || true

      - name: Install Playwright in isolated workspace
        if: env.NO_PARENT_JOB != 'true'
        run: |
          npm install --prefix "$PARENT_WORKDIR" --no-save playwright@1.55.0
          "$PARENT_WORKDIR/node_modules/.bin/playwright" install --with-deps chromium

      - name: Run Focus grades and GPA
        if: env.NO_PARENT_JOB != 'true'
        id: grades
        working-directory: /tmp/parent-school-run
        continue-on-error: true
        run: node school-monitor.mjs 2>grade-stderr.txt

      - name: Publish Focus grades and GPA immediately
        if: env.NO_PARENT_JOB != 'true' && steps.grades.outcome == 'success'
        run: node parent-worker-client.mjs publish

      - name: Record failed Focus run
        if: env.NO_PARENT_JOB != 'true' && steps.grades.outcome == 'failure'
        env:
          WORKER_ERROR: method=student_sso; grades=${{ steps.grades.outcome }}; ad_hoc=focus_gpa
        run: node parent-worker-client.mjs fail

      - name: Mark Focus collection failure
        if: env.NO_PARENT_JOB != 'true' && steps.grades.outcome == 'failure'
        run: exit 1
