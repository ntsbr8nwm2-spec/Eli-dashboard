name: Parent dashboard worker

on:
  workflow_dispatch:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  push:
    paths:
      - 'parent-worker-client.mjs'
      - 'school-monitor.mjs'
      - 'focus-parent-monitor.mjs'
      - 'focus-auth-probe.mjs'
      - 'focus-clever-probe.mjs'
      - 'focus-full-browser-probe.mjs'
      - '.github/workflows/parent-worker.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: parent-dashboard-worker
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PARENT_WORKDIR: /tmp/parent-school-run

    steps:
      - name: Check out monitor engine
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lease next private parent dashboard
        id: lease
        run: node parent-worker-client.mjs lease

      - name: Prepare isolated student workspace
        if: env.NO_PARENT_JOB != 'true'
        run: |
          cp school-monitor.mjs focus-parent-monitor.mjs canvas-only.mjs canvas-guard.mjs focus-news-v2.mjs sanitize-dashboard.mjs focus-auth-probe.mjs focus-clever-probe.mjs focus-full-browser-probe.mjs "$PARENT_WORKDIR"/
          chmod 700 "$PARENT_WORKDIR"
          chmod 600 "$PARENT_WORKDIR"/*.json || true

      - name: Install Playwright in isolated workspace
        if: env.NO_PARENT_JOB != 'true'
        run: |
          npm install --prefix "$PARENT_WORKDIR" --no-save playwright@1.55.0
          "$PARENT_WORKDIR/node_modules/.bin/playwright" install --with-deps chromium

      - name: Run Focus grades
        if: env.NO_PARENT_JOB != 'true'
        id: grades
        working-directory: /tmp/parent-school-run
        continue-on-error: true
        run: |
          if [ "$SCHOOL_LOGIN_METHOD" = "parent_portal" ]; then
            node focus-parent-monitor.mjs 2>grade-stderr.txt
          else
            node school-monitor.mjs 2>grade-stderr.txt
          fi

      - name: Print safe Focus diagnostics
        if: env.NO_PARENT_JOB != 'true' && env.SCHOOL_LOGIN_METHOD != 'parent_portal' && steps.grades.outcome == 'failure'
        working-directory: /tmp/parent-school-run
        run: |
          echo "--- SAFE FOCUS AUTH DIAGNOSTICS ---"
          if [ -f auth-debug.json ]; then cat auth-debug.json; else echo "No auth-debug.json was produced."; fi
          echo "--- END SAFE FOCUS AUTH DIAGNOSTICS ---"

      - name: Classify Microsoft auth failure
        if: env.NO_PARENT_JOB != 'true' && env.SCHOOL_LOGIN_METHOD != 'parent_portal' && steps.grades.outcome == 'failure'
        working-directory: /tmp/parent-school-run
        continue-on-error: true
        run: node focus-auth-probe.mjs

      - name: Probe Clever Focus fallback
        if: env.NO_PARENT_JOB != 'true' && env.SCHOOL_LOGIN_METHOD != 'parent_portal' && steps.grades.outcome == 'failure'
        working-directory: /tmp/parent-school-run
        continue-on-error: true
        run: node focus-clever-probe.mjs

      - name: Probe normal full Chrome
        if: env.NO_PARENT_JOB != 'true' && env.SCHOOL_LOGIN_METHOD != 'parent_portal' && steps.grades.outcome == 'failure'
        working-directory: /tmp/parent-school-run
        continue-on-error: true
        run: xvfb-run -a node focus-full-browser-probe.mjs

      - name: Save previous Canvas assignments
        if: env.NO_PARENT_JOB != 'true' && env.SCHOOL_LOGIN_METHOD != 'parent_portal' && steps.grades.outcome == 'success'
        working-directory: /tmp/parent-school-run
        run: node canvas-guard.mjs before

      - name: Run Canvas assignments
        if: env.NO_PARENT_JOB != 'true' && env.SCHOOL_LOGIN_METHOD != 'parent_portal' && steps.grades.outcome == 'success'
        id: canvas
        working-directory: /tmp/parent-school-run
        continue-on-error: true
        run: node canvas-only.mjs

      - name: Confirm empty Canvas result
        if: env.NO_PARENT_JOB != 'true' && env.SCHOOL_LOGIN_METHOD != 'parent_portal' && steps.canvas.outcome == 'success'
        working-directory: /tmp/parent-school-run
        run: node canvas-guard.mjs after

      - name: Run Focus activity
        if: env.NO_PARENT_JOB != 'true' && env.SCHOOL_LOGIN_METHOD != 'parent_portal' && steps.grades.outcome == 'success'
        id: news
        working-directory: /tmp/parent-school-run
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            echo "Focus News attempt $attempt"
            if node focus-news-v2.mjs; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 4; fi
          done
          exit 1

      - name: Sanitize student-login dashboard data
        if: env.NO_PARENT_JOB != 'true' && env.SCHOOL_LOGIN_METHOD != 'parent_portal' && steps.grades.outcome == 'success' && steps.canvas.outcome == 'success' && steps.news.outcome == 'success'
        working-directory: /tmp/parent-school-run
        run: node sanitize-dashboard.mjs

      - name: Publish student-login dashboard
        if: env.NO_PARENT_JOB != 'true' && env.SCHOOL_LOGIN_METHOD != 'parent_portal' && steps.grades.outcome == 'success' && steps.canvas.outcome == 'success' && steps.news.outcome == 'success'
        run: node parent-worker-client.mjs publish

      - name: Publish Parent Portal dashboard
        if: env.NO_PARENT_JOB != 'true' && env.SCHOOL_LOGIN_METHOD == 'parent_portal' && steps.grades.outcome == 'success'
        run: node parent-worker-client.mjs publish

      - name: Record failed private run
        if: always() && env.NO_PARENT_JOB != 'true' && (steps.grades.outcome == 'failure' || (env.SCHOOL_LOGIN_METHOD != 'parent_portal' && (steps.canvas.outcome == 'failure' || steps.news.outcome == 'failure')))
        env:
          WORKER_ERROR: method=${{ env.SCHOOL_LOGIN_METHOD }}; grades=${{ steps.grades.outcome }}; canvas=${{ steps.canvas.outcome }}; news=${{ steps.news.outcome }}
        run: node parent-worker-client.mjs fail

      - name: Mark collector failure
        if: env.NO_PARENT_JOB != 'true' && (steps.grades.outcome == 'failure' || (env.SCHOOL_LOGIN_METHOD != 'parent_portal' && (steps.canvas.outcome == 'failure' || steps.news.outcome == 'failure')))
        run: exit 1
