name: Apply current school year Canvas filter

on:
  push:
    paths:
      - 'apply-current-school-year-filter.mjs'
      - '.github/workflows/apply-current-school-year-filter.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply current school year filter
        run: node apply-current-school-year-filter.mjs
      - name: Syntax check collector
        run: node --check canvas-only.mjs
      - name: Commit filter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canvas-only.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Filter Canvas activity to current school year"
          git push
