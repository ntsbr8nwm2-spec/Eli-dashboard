name: Fix graded Canvas classification

on:
  push:
    paths:
      - 'fix-graded-notgraded.mjs'
      - '.github/workflows/fix-graded-notgraded.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix graded classification
        run: node fix-graded-notgraded.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parent/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Classify graded Canvas activity as submissions"
          git push
